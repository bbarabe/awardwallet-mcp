name: Release

# Push a tag like v0.2.0 (matching package.json, mcpb/manifest.json and both plugin manifests) to
# publish a release with the Claude Desktop extension and the single-file server attached, and to update
# the plugin branch, which ChatGPT, Codex and Claude install the plugin from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag matches the package and manifest versions
        run: >-
          node -e "const v = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const p = require('./package.json'), m = require('./mcpb/manifest.json'), c = require('./plugin/plugin.json'), cc = require('./plugin/.claude-plugin/plugin.json');
          if ([p, m, c, cc].some((x) => x.version !== v)) { console.error('tag', v, 'package.json', p.version, 'manifest', m.version, 'plugin', c.version, 'claude plugin', cc.version); process.exit(1); }"
      - run: npm run typecheck
      - run: npm test
      - name: Build the server, the Claude Desktop extension and the plugin
        run: npm run pack:mcpb && node scripts/pack-plugin.mjs
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/awardwallet-mcp.mcpb#Claude Desktop extension (awardwallet-mcp.mcpb)" \
            "dist/awardwallet-mcp.mjs#Server for Codex CLI, OpenClaw and other MCP apps (awardwallet-mcp.mjs)" \
            --verify-tag \
            --title "AwardWallet MCP $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$(cat .github/release-notes.md)"
      - name: Publish the plugin marketplace to the plugin branch
        run: |
          if git ls-remote --exit-code --heads origin plugin >/dev/null; then
            git fetch --depth=1 origin plugin
            git worktree add -B plugin marketplace FETCH_HEAD
          else
            git worktree add --orphan -b plugin marketplace
          fi
          find marketplace -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a build/chatgpt-marketplace/. marketplace/
          cd marketplace
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "AwardWallet plugin $GITHUB_REF_NAME"
          git push origin plugin
