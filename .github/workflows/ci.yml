name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build and validate the Claude Desktop extension
        run: npm run pack:mcpb
      - name: Build the plugin marketplace (ChatGPT, Codex and Claude)
        run: npm run pack:plugin
      - name: Check the release workflow publishes the folder pack:plugin builds
        shell: bash
        run: |
          src=$(grep -o 'cp -a build/[^/ ]*' .github/workflows/release.yml | cut -d' ' -f3)
          test -f "$src/.agents/plugins/marketplace.json" && test -f "$src/.claude-plugin/marketplace.json"
